[package]
name = "fluid_game"
description = "Bevy desktop app: input, rendering, and the fixed-timestep loop around fluid_sim."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
fluid_sim = { path = "../fluid_sim" }
# Pinned (ADR 0001). Only the features the game uses: no audio or gamepads yet,
# which keeps the ALSA and udev system packages out of the build.
bevy = { version = "=0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "2d_bevy_render",
    "default_font",
    "tonemapping_luts",
    "zstd_rust",
] }
# Setup screen UI (ADR 0001). Only rendering and fonts: no bevy_ui, picking or clipboard.
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
