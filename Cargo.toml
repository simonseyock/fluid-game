[workspace]
resolver = "3"
members = ["crates/fluid_sim", "crates/fluid_game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Bevy is slow in plain debug builds: optimize dependencies, keep our code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
